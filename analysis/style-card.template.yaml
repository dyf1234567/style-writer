# 叙事风格特征卡 · 长篇连载版（20 万字 +）
#
# 【填写铁律 —— 违反即作废】
#   1. 只记「方法」，不记「内容」。任何字段的值里都不得出现具体情节、人名、地名、
#      招式名、金句、独特点喻。一旦出现，该字段必须改写为抽象描述或直接删除。
#   2. 能量化的必须量化，且标注取样范围。没有数字的形容词（"很快""很细腻"）无效。
#   3. 数值一律用「中位数 + p90」而不是平均数，长篇里平均数会被个别长章带偏。
#   4. 本卡将直接进入生成提示词。填完后跑一次红线自检（见文件末尾）。
#
# 数据来源约定：标 [M] 的字段由 scripts/measure.py 统计得到；
#               标 [R] 的需要人工阅读抽样后判断；
#               标 [I] 的为推断项，须注明置信度。
#
# v2（2026-09-08）：新增第 8 节 emotion_writing 与第 9 节 reward_rhythm；
#   measure.py v4 的词层输出（lexeme 段）为两节及 7 对白意象提供 [M] 参考值。

meta:
  target_work: ""            # 目标作品名，仅内部标注，禁止进入生成提示词
  sample_range: ""           # 例如：第 1-320 章 / 第 1-5 卷
  sample_words: 0            # [M]
  measured_at: ""

# ---------------------------------------------------------------- 1 视角与声音
voice:
  person: ""                 # [R] 第一 / 第三 / 第二人称，是否切换
  focalization: ""           # [R] 固定内聚焦 / 可变内聚焦 / 零聚焦 / 外聚焦
  focal_char_count: 0        # [R] 视角人物数量（长篇常见 1-3）
  reliability: ""            # [R] 可靠 / 有限可靠 / 不可靠，及暴露方式
  distance: ""               # [R] 是否进入内心独白、进入频率、叙述者是否评论
  narrator_comment_ratio: 0.0  # [R] 叙述者直接发言占比（0-1），长篇网文通常 <0.02
  tense: ""                  # [R] 过去 / 现在 / 混合

# ---------------------------------------------------------------- 2 时间与顺序
timeline:
  base_order: ""             # [R] 顺叙为主 / 倒叙框架 / 双线交织
  analepsis_ratio: 0.0       # [R] 倒叙段落占比（0-1）
  prolepsis_ratio: 0.0       # [R] 预叙（提前透露后事）占比
  scene_time_ratio: 0.0      # [R] 叙述时长 / 故事时长，>1 为放慢，<1 为压缩
  ellipsis_span: ""          # [R] 典型省略跨度，如「跨过三日只写一句」

# ---------------------------------------------------------------- 3 分线结构 ★核心
plotlines:
  count: 0                   # [R] 同时推进的线数
  lines:
    - id: A
      role: ""               # 主线 / 副线 / 支线
      function: ""           # 推进目标 / 补世界观 / 情感锚点 / 缓冲节奏 / 制造压迫
      weight: 0.0            # 篇幅权重，全部相加应为 1.0
      pov: ""                # 该线主要视角人物
    - id: B
      role: ""
      function: ""
      weight: 0.0
      pov: ""
    - id: C
      role: ""
      function: ""
      weight: 0.0
      pov: ""
  switch_trigger: ""         # 按章切 / 按场景切 / 按情绪高点切 / 按悬念最强处切
  switch_transition: ""      # 硬切 / 时间词衔接 / 尾词钩连 / 空行分隔
  convergence_every: 0       # [R] 主线与副线平均多少章交汇一次
  line_close_pattern: ""     # [R] 支线收束方式：单元剧式收干净 / 长弧并入主线

# ---------------------------------------------------------------- 4 连载节奏 ★核心
serial_rhythm:
  words_per_chapter:         # [M]
    median: 0
    p10: 0
    p90: 0
  words_curve_note: ""       # [M] 篇幅曲线走势：稳定 / 前短后长 / 随高潮拉长
  scenes_per_chapter: 0.0    # [R] 章均场景数
  chapter_hook_type: ""      # [R] 悬念式 / 反转式 / 信息式 / 情绪式 / 无钩子
  hook_strength_by_position: ""  # [R] 卷首 / 卷中 / 卷末的钩子强度差异
  tension_relax_ratio: ""    # [R] 如 3:2，紧张段与松弛段的篇幅比
  arc_length: 0              # [R] 一个大高潮弧平均跨多少章
  arc_recovery: 0            # [R] 高潮后缓冲多少章回到日常线
  cliffhanger_frequency: 0.0 # [R] 每多少章出现一次强断章

# ---------------------------------------------------------------- 5 场景与描写
scene:
  scene_words: [0, 0]        # [R] 单场景字数区间
  show_vs_tell: ""           # [R] 展示 / 讲述的大致比例
  description_ratio: 0.0     # [R] 纯描写占全文比例
  sensory_mix: ""            # [R] 视觉 / 听觉 / 触觉 / 嗅觉 的配比倾向
  scenery_function: ""       # [R] 景物是氛围烘托 / 情绪外化 / 信息载体 / 节奏刹车

# ---------------------------------------------------------------- 6 句法与语域
syntax:
  sentence_len:              # [M]
    median: 0
    p90: 0
    short_le10_ratio: 0.0
    long_ge40_ratio: 0.0
  paragraph_len:             # [M]
    median: 0
    p90: 0
    short_para_ratio: 0.0    # 短段（<=20 字）占比，高则节奏轻快
  dialogue_char_ratio: 0.0   # [M] 对话字符占比
  dialogue_blocks_per_1k: 0.0  # [M] 每千字对话块数
  punct_per_1k:              # [M]
    exclam: 0.0
    question: 0.0
    ellipsis: 0.0
    dash: 0.0
  register: ""               # [R] 雅 / 俗 / 半文半白 / 口语化 / 行话密度
  sentence_rhythm_note: ""   # [R] 长句铺陈后是否惯用短句收束
  lexical_fingerprint: []    # [M·v2] 口癖/高频功能词 top-N，只填通用词（语气词、副词、动词），
                             #        禁止人名、招式名等专名 —— 参考 measure lexeme.top_lexemes

# ---------------------------------------------------------------- 7 对白与意象
dialogue_style:
  subtext_density: ""        # [R] 高 / 中 / 低：是否常说反话、答非所问
  individuality: ""          # [R] 不同角色的语言区分度靠什么：口癖 / 句式 / 用词 / 信息量
  exposition_in_dialogue: "" # [R] 是否借对白交代背景，占比如何

imagery:
  semantic_domains: []       # [R] 高频语义域（类别词，如「身体感」「天气」「器物」）
  metaphor_type: ""          # [R] 明喻 / 暗喻 / 借代 / 通感的偏好
  recurrence_interval: ""    # [R] 核心意象的复现间隔与变奏方式
  taboo: []                  # [R] 该作者明显回避的表达
  simile_markers_per_1k: 0.0 # [M·v2] 明喻标记词密度（像/如/仿佛/似的/宛如…每千字）
                             #        —— 参考 measure lexeme.simile_per_1k

# ---------------------------------------------------------------- 8 情感书写 ★v2 新增
emotion_writing:
  carrier: ""                # [R] 情绪主要靠什么承载：身体反应 / 动作细节 / 景物投射 / 内心独白 / 对白潜台词
  escalation_pattern: ""     # [R] 情绪升级路径：层层加压 / 瞬间爆发后冷却 / 反差切入
  restraint_level: ""        # [R] 克制 / 中档 / 浓烈（抒情浓度，可用标点与短句比佐证）
  peak_label: ""             # [R] 卷内情绪峰值段落的写法特征（不写具体内容，只写手法）
  emotion_words_per_1k: 0.0  # [M] 显性情绪词密度（每千字）—— 参考 measure lexeme.emotion_per_1k
  body_reaction_ratio: ""    # [I] 情绪句中含身体反应词（手/心跳/喉咙等）的占比估计，注明置信度

# ---------------------------------------------------------------- 9 回报节律 ★v2 新增
reward_rhythm:
  payoff_unit: ""            # [R] 爽点/泪点的最小兑现单元：打脸 / 越级取胜 / 身份揭示 / 重逢 / 翻案
  payoff_interval: 0         # [R] 平均每隔多少章兑现一次小回报
  buildup_release_ratio: ""  # [R] 压抑段与释放段的篇幅比（如 4:1 —— 压得越久放得越响）
  installment_style: ""      # [R] 回报的分期方式：一次性结清 / 分层递进结清 / 故意拖欠至卷末
  promise_drift: ""          # [R] 立 flag 到兑现的平均章数跨度；长期拖欠则注明读者反馈模式
  curve_within_arc: ""       # [R] 大高潮弧内部回报分布：前低后高 / 双峰 / 末段集中
  chapter_micro_payoff: ""   # [R] 章内是否必带小回报（信息增量 / 小胜利 / 新钩子），频率多少

# ---------------------------------------------------------------- 红线自检
# 填完后逐项打勾，任何一项不通过就回改：
#   [ ] 全卡不含任何具体人名、地名、招式名、组织名
#   [ ] 全卡不含任何原句、金句、独特点喻
#   [ ] 全卡不含任何具体情节（"主角在第 X 章做了 Y" 一律不允许）
#   [ ] 所有 weight / ratio 数值之和在合理范围内
#   [ ] 每个 [I] 推断项都标注了置信度
#   [ ] 把本卡给一个没读过原作的人看，他无法还原出任何一幕具体场景
